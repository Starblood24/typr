[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typr-terminal"
version = "0.1.0"
description = "A quiet, keyboard-first terminal typing utility."
requires-python = ">=3.11"
dependencies = ["textual==8.2.8", "platformdirs>=3.6,<5"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
typr = "typr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
typr = ["assets/art/*.txt", "assets/words/*.json", "assets/stories/*/*.json", "ui/*.tcss"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
